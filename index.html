<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1117" />
  <title>運動紀錄 App</title>
  <style>
    :root {
      --bg: #0b1117;
      --surface: #131c26;
      --surface-2: #1b2735;
      --border: #273749;
      --text: #eef4fa;
      --muted: #8fa3b8;
      --accent: #22d3ee;
      --accent-2: #a3e635;
      --orange: #fb923c;
      --danger: #f87171;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 17, 23, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .local-badge {
      font-size: 11px;
      background: rgba(163, 230, 53, 0.14);
      color: var(--accent-2);
      border: 1px solid rgba(163, 230, 53, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .date-bar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .month-select {
      width: auto;
      min-width: 118px;
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .date-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }
    .date-strip::-webkit-scrollbar { display: none; }
    .date-strip.dragging { cursor: grabbing; }

    .date-spacer {
      flex: 0 0 calc(50% - 31px);
      pointer-events: none;
    }

    .date-chip {
      flex: 0 0 62px;
      min-width: 62px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
    }
    .date-chip.active {
      background: rgba(34, 211, 238, 0.22);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .date-chip .wk { font-size: 11px; color: var(--muted); }
    .date-chip.active .wk { color: var(--accent); font-weight: 700; }
    .date-chip .dy { font-size: 15px; font-weight: 700; margin-top: 2px; }
    .date-chip .dot {
      width: 6px; height: 6px; border-radius: 50%;
      margin: 5px auto 0; background: var(--accent-2);
    }

    .section-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .quick-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .quick-row .section-label { margin-bottom: 0; }

    .cat-timer-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 14px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .cat-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      line-height: 1.2;
    }
    .cat-btn.active {
      background: var(--accent);
      color: #071018;
      border-color: var(--accent);
    }
    .cat-btn.active.rest-cat {
      background: var(--orange);
      color: #160b04;
      border-color: var(--orange);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .card-title { font-size: 15px; font-weight: 700; }

    .pill-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }
    .pill:hover { border-color: var(--accent); }

    .row-3 {
      display: grid;
      grid-template-columns: 52px 1fr 1fr 28px;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .del-set-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--danger);
      border-radius: 8px;
      height: 34px;
      width: 28px;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
    }

    input, select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #071018; }
    .btn-orange { background: var(--orange); color: #160b04; }
    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-sm { padding: 6px 10px; font-size: 12px; }

    .ex-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .ex-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .ex-name { font-weight: 700; font-size: 15px; }
    .set-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      padding: 4px 0;
      border-top: 1px dashed rgba(143, 163, 184, 0.16);
    }
    .set-line strong { color: var(--text); }

    .timer-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      text-align: right;
      background: linear-gradient(135deg, rgba(34,211,238,0.12), rgba(163,230,53,0.08));
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: 12px;
      padding: 8px 9px;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .timer-num {
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      transition: font-size 0.2s ease;
    }
    .timer-btns {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .timer-btn {
      padding: 4px 6px;
      font-size: 11px;
      border-radius: 7px;
      font-weight: 700;
      cursor: pointer;
    }

    .timer-box.running {
      grid-column: 1 / -1;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(34,211,238,0.22), rgba(163,230,53,0.16));
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(34,211,238,0.35);
    }
    .timer-box.running .timer-num { font-size: 32px; }
    .timer-box.running .timer-btn { padding: 7px 10px; font-size: 12px; border-radius: 9px; }

      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12
