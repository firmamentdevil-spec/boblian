<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1117" />
  <title>運動紀錄 App</title>
  <style>
    :root {
      --bg: #0b1117;
      --surface: #131c26;
      --surface-2: #1b2735;
      --border: #273749;
      --text: #eef4fa;
      --muted: #8fa3b8;
      --accent: #22d3ee;
      --accent-2: #a3e635;
      --orange: #fb923c;
      --danger: #f87171;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 17, 23, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .local-badge {
      font-size: 11px;
      background: rgba(163, 230, 53, 0.14);
      color: var(--accent-2);
      border: 1px solid rgba(163, 230, 53, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .date-bar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .month-select {
      width: auto;
      min-width: 118px;
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .date-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }
    .date-strip::-webkit-scrollbar { display: none; }
    .date-strip.dragging { cursor: grabbing; }

    .date-spacer {
      flex: 0 0 calc(50% - 31px);
      pointer-events: none;
    }

    .date-chip {
      flex: 0 0 62px;
      min-width: 62px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
    }
    .date-chip.active {
      background: rgba(34, 211, 238, 0.22);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .date-chip .wk { font-size: 11px; color: var(--muted); }
    .date-chip.active .wk { color: var(--accent); font-weight: 700; }
    .date-chip .dy { font-size: 15px; font-weight: 700; margin-top: 2px; }
    .date-chip .dot {
      width: 6px; height: 6px; border-radius: 50%;
      margin: 5px auto 0; background: var(--accent-2);
    }

    .section-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .quick-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .quick-row .section-label { margin-bottom: 0; }

    .cat-timer-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 14px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .cat-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      line-height: 1.2;
      min-width: 0;
    }
    .cat-btn.rest-scroll-btn {
      display: block;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }
    .cat-btn.rest-scroll-btn::-webkit-scrollbar { display: none; }
    .cat-btn.rest-scroll-btn.dragging { cursor: grabbing; }

    .cat-btn.active {
      background: var(--accent);
      color: #071018;
      border-color: var(--accent);
    }
    .cat-btn.active.rest-cat {
      background: var(--orange);
      color: #160b04;
      border-color: var(--orange);
    }

    .rest-inline-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .rest-inline-text {
      min-width: 0;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }
    .rest-inline-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--orange);
      margin-right: 6px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .card-title { font-size: 15px; font-weight: 700; }

    .pill-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }
    .pill:hover { border-color: var(--accent); }

    .row-3 {
      display: grid;
      grid-template-columns: 52px 1fr 1fr 28px;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .del-set-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--danger);
      border-radius: 8px;
      height: 34px;
      width: 28px;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
    }

    input, select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #071018; }
    .btn-orange { background: var(--orange); color: #160b04; }
    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-sm { padding: 6px 10px; font-size: 12px; }

    .ex-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .ex-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .ex-name { font-weight: 700; font-size: 15px; }
    .set-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      padding: 4px 0;
      border-top: 1px dashed rgba(143, 163, 184, 0.16);
    }
    .set-line strong { color: var(--text); }

    .timer-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, rgba(34,211,238,0.12), rgba(163,230,53,0.08));
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: 12px;
      padding: 8px 10px;
      gap: 8px;
      min-width: 0;
    }
    .timer-num {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      white-space: nowrap;
    }
    .circle-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .circle-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .chart-wrap {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-top: 10px;
    }
    .chart-legend {
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .legend-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .chart-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
      text-align: center;
    }
    .stat-box {
      background: rgba(11, 17, 23, 0.55);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 4px;
    }
    .stat-box .val { font-size: 13px; font-weight: 700; color: var(--text); }
    .stat-box .lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(11, 17, 23, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 0 10px;
      z-index: 30;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      font-size: 11px; font-weight: 600; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-icon { font-size: 17px; }

    .hidden { display: none; }
    .muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-title">
      <span>運動紀錄</span>
      <span class="local-badge">純本機儲存</span>
    </div>
    <span class="muted" id="activeDateText"></span>
  </div>

  <div class="container">
    <div id="tab-log">
      <div class="date-bar-top">
        <span class="muted">拖曳或點選日期</span>
        <select id="monthSelect" class="month-select" onchange="onMonthChange(this.value)"></select>
      </div>
      <div class="date-strip" id="dateStrip"></div>

      <div class="cat-timer-row" style="margin-bottom:6px;">
        <div class="section-label" style="margin-bottom:0;">當日訓練分類</div>
        <div class="section-label" style="margin-bottom:0; text-align:right;">組間碼表</div>
      </div>

      <div class="cat-timer-row">
        <div class="cat-grid" id="catGrid"></div>

        <div class="timer-box" id="timerBox">
          <div class="timer-num" id="timerDisplay">00:00</div>
          <div class="circle-btn-group">
            <button type="button" class="btn btn-primary circle-icon-btn" id="timerToggleBtn" title="開始 / 暫停" onclick="toggleTimer()">▶</button>
            <button type="button" class="btn btn-ghost circle-icon-btn" title="歸零重設" onclick="resetTimer()">↺</button>
          </div>
        </div>
      </div>

      <div class="card rest-inline-card hidden" id="restCard">
        <div class="rest-inline-text" id="restInlineText">
          <span class="rest-inline-title">今日狀態：低強度/休息</span>
          <span class="muted" id="restCardDesc">點擊右上角按鈕才會把這天寫入紀錄，或直接於下方加入低強度動作。</span>
        </div>
        <button type="button" class="btn btn-orange btn-sm" style="flex:0 0 auto; white-space:nowrap;" id="markRestBtn" onclick="markRestDay()">記錄為休息日</button>
      </div>

      <div class="card" id="strengthCard">
        <div class="card-header">
          <div class="card-title">新增動作組數</div>
          <span class="muted">次數 / 重量kg</span>
        </div>

        <div class="quick-row">
          <span class="section-label">常用動作快選</span>
          <span class="muted">可直接手動輸入動作</span>
        </div>
        <div class="pill-row" id="quickExercises"></div>

        <div style="margin-bottom:10px;">
          <input type="text" id="exNameInput" placeholder="動作名稱" />
        </div>

        <div id="setsContainer"></div>

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn btn-ghost btn-sm" onclick="addSetRow()">＋ 增加一組</button>
          <button class="btn btn-primary" style="flex:1;" onclick="saveStrengthEntry()">加入今日紀錄</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">當日紀錄清單</div>
          <span class="muted" id="daySummaryBadge"></span>
        </div>
        <div id="dayEntriesList"></div>
      </div>
    </div>

    <div id="tab-overview" class="hidden">
      <div class="card">
        <div class="card-title" style="margin-bottom:10px;">日期紀錄總覽</div>
        <div id="overviewList"></div>
      </div>
    </div>

    <div id="tab-library" class="hidden">
      <div class="card">
        <div class="card-title" style="margin-bottom:8px;">分類動作庫</div>
        <div id="libraryList"></div>
      </div>
    </div>

    <div id="tab-chart" class="hidden">
      <div class="card">
        <div class="card-header">
          <div class="card-title">訓練進步曲線圖</div>
          <span class="muted">依歷次紀錄自動統計</span>
        </div>
        <select id="chartExerciseSelect" onchange="renderProgressChart()"></select>
        <div id="progressChartContainer"></div>
      </div>
    </div>

    <div id="tab-storage" class="hidden">
      <div class="card">
        <div class="card-title">本機資料與備份</div>
        <p class="muted" style="line-height:1.6; margin:8px 0 12px;">
          資料僅存於手機瀏覽器本機 <code>localStorage</code>，無外部伺服器或登入系統。建議定期匯出 JSON 備份。
        </p>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" onclick="exportJSON()">匯出 JSON</button>
          <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
            匯入 JSON <input type="file" accept=".json" style="display:none;" onchange="importJSON(event)" />
          </label>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="clearAllData()">清空本機資料</button>
        </div>
        <pre id="jsonPreview" style="margin-top:12px; background:var(--surface-2); padding:10px; border-radius:10px; font-size:11px; max-height:220px; overflow:auto; color:var(--muted);"></pre>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="tab-log" onclick="switchTab('tab-log', this)">
      <span class="nav-icon">🏋️</span><span>今日紀錄</span>
    </button>
    <button class="nav-btn" data-tab="tab-overview" onclick="switchTab('tab-overview', this)">
      <span class="nav-icon">📅</span><span>日期總覽</span>
    </button>
    <button class="nav-btn" data-tab="tab-library" onclick="switchTab('tab-library', this)">
      <span class="nav-icon">📋</span><span>動作庫</span>
    </button>
    <button class="nav-btn" data-tab="tab-chart" onclick="switchTab('tab-chart', this)">
      <span class="nav-icon">📈</span><span>曲線圖</span>
    </button>
    <button class="nav-btn" data-tab="tab-storage" onclick="switchTab('tab-storage', this)">
      <span class="nav-icon">🔒</span><span>本機資料</span>
    </button>
  </nav>

  <script>
    /* ===== 可自行擴充設定區 ===== */
    const CATEGORIES = ['重量訓練', '衝浪訓練', '高強度間接', '有氧訓練', '低強度/休息'];

    /* 順序規則：槓鈴 -> 啞鈴 -> 機械 -> 其餘不重複名稱排後面 */
    const EXERCISE_POOL = {
      '重量訓練': [
        '槓鈴握推', '槓鈴深蹲', '槓鈴肩推', '槓鈴RDL', '槓鈴大腿側蹲',
        '啞鈴坐式肩推', '啞鈴胸推',
        '滑輪下拉(機械)', '水平划船(機械)', '肩側部(機械)',
        '捲腹(重訓椅&懸吊)', '引體向上'
      ],
      '衝浪訓練': [
        '啞鈴肩推(滑水)', '趴式Y式啞鈴',
        '滑輪側腹轉體', '滑輪下拉划水', '地雷管爆發上推', '地雷管單手肩推', '地雷管軀幹旋轉', '單腿RDL', '哥本哈根側棒式'
      ],
      '高強度間接': [
        '槓鈴分腿蹲',
        '啞鈴肩推(滑水)', '啞鈴反向飛鳥(Y式)',
        '大腿寬內外收(機械)', '直臂下拉(機械)',
        '肩推深蹲(複合)', '單腿RDL', '捲腹(重訓椅&懸吊)', '地雷管爆發上推'
      ],
      '有氧訓練': ['慢跑', '游泳', '20分間歇'],
      '低強度/休息': []
    };

    const STORAGE_KEY = 'personal_workout_log_v1';
    /* ============================ */

    function formatToday() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function isDayRecorded(dayObj) {
      if (!dayObj || typeof dayObj !== 'object') return false;
      const hasExercises = Array.isArray(dayObj.exercises) && dayObj.exercises.length > 0;
      const isMarkedRest = Boolean(dayObj.restMarked);
      return hasExercises || isMarkedRest;
    }

    function cleanEmptyRecords(rawObj) {
      const cleaned = {};
      if (!rawObj || typeof rawObj !== 'object' || Array.isArray(rawObj)) return cleaned;
      Object.keys(rawObj).forEach(d => {
        const item = rawObj[d];
        if (!item || typeof item !== 'object') return;
        const exercises = Array.isArray(item.exercises) ? item.exercises : [];
        const restMarked = Boolean(item.restMarked);
        if (exercises.length > 0 || restMarked) {
          cleaned[d] = {
            category: item.category || '重量訓練',
            exercises,
            ...(restMarked ? { restMarked: true } : {})
          };
        }
      });
      return cleaned;
    }

    function loadDB() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch {
        return {};
      }
    }

    let db = cleanEmptyRecords(loadDB());
    let selectedDate = formatToday();
    let activeCategory = db[selectedDate]?.category || '重量訓練';
    let didDragStrip = false;
    let didDragRestBtn = false;

    function saveDB() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch {}
      renderJSONPreview();
    }

    function getMonthDates(ym) {
      const parts = String(ym || '').split('-');
      const y = Number(parts[0]) || new Date().getFullYear();
      const m = Number(parts[1]) || (new Date().getMonth() + 1);
      const yStr = String(y);
      const mStr = String(m).padStart(2, '0');
      const daysInMonth = new Date(y, m, 0).getDate();
      const list = [];
      for (let d = 1; d <= daysInMonth; d++) {
        list.push(`${yStr}-${mStr}-${String(d).padStart(2, '0')}`);
      }
      return list;
    }

    function renderMonthOptions() {
      const sel = document.getElementById('monthSelect');
      if (!sel) return;
      const todayStr = formatToday();
      const currentYM = todayStr.slice(0, 7);
      const selectedYM = selectedDate.slice(0, 7);

      const months = new Set([currentYM, selectedYM]);
      const baseDate = new Date(todayStr + 'T00:00:00');
      for (let offset = -5; offset <= 1; offset++) {
        const dt = new Date(baseDate.getFullYear(), baseDate.getMonth() + offset, 1);
        months.add(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`);
      }
      Object.keys(db).forEach(d => {
        if (isDayRecorded(db[d]) && d.length >= 7) months.add(d.slice(0, 7));
      });

      const sorted = [...months].sort();
      sel.innerHTML = sorted.map(ym => `<option value="${ym}">${ym}</option>`).join('');
      sel.value = selectedYM;
    }

    function onMonthChange(ym) {
      if (!ym) return;
      const todayStr = formatToday();
      selectedDate = ym === todayStr.slice(0, 7) ? todayStr : `${ym}-01`;
      activeCategory = db[selectedDate]?.category || '重量訓練';
      renderAll();
    }

    function scrollActiveDateIntoView() {
      const strip = document.getElementById('dateStrip');
      if (!strip) return;
      const activeChip = strip.querySelector('.date-chip.active');
      if (activeChip) {
        const left = activeChip.offsetLeft - (strip.clientWidth / 2) + (activeChip.offsetWidth / 2);
        strip.scrollLeft = Math.max(0, left);
      }
    }

    function renderDateStrip() {
      const strip = document.getElementById('dateStrip');
      if (!strip) return;
      const ym = selectedDate.slice(0, 7);
      const dates = getMonthDates(ym);
      const wkNames = ['日','一','二','三','四','五','六'];
      const todayStr = formatToday();

      const chipsHtml = dates.map(d => {
        const dt = new Date(d + 'T00:00:00');
        const hasLog = isDayRecorded(db[d]);
        const isToday = d === todayStr;
        return `
          <div class="date-chip ${d === selectedDate ? 'active' : ''}" onclick="handleChipClick('${d}')">
            <div class="wk">${isToday ? '今日' : '週' + wkNames[dt.getDay()]}</div>
            <div class="dy">${d.slice(5)}</div>
            <div class="dot" style="opacity:${hasLog ? 1 : 0.15}"></div>
          </div>
        `;
      }).join('');

      strip.innerHTML = `<div class="date-spacer"></div>${chipsHtml}<div class="date-spacer"></div>`;
      const activeDateEl = document.getElementById('activeDateText');
      if (activeDateEl) activeDateEl.textContent = selectedDate;
      renderMonthOptions();
      setTimeout(scrollActiveDateIntoView, 0);
    }

    function handleChipClick(d) {
      if (didDragStrip) {
        didDragStrip = false;
        return;
      }
      selectDate(d);
    }

    function handleRestBtnClick(cat) {
      if (didDragRestBtn) {
        didDragRestBtn = false;
        return;
      }
      setCategory(cat);
    }

    function bindRestBtnDrag() {
      const btn = document.getElementById('restCatBtn');
      if (!btn || btn.dataset.dragBound) return;
      btn.dataset.dragBound = '1';
      let isDown = false;
      let startX = 0;
      let startScrollLeft = 0;

      btn.addEventListener('mousedown', e => {
        isDown = true;
        didDragRestBtn = false;
        btn.classList.add('dragging');
        startX = e.pageX - btn.offsetLeft;
        startScrollLeft = btn.scrollLeft;
      });

      window.addEventListener('mouseup', () => {
        if (!isDown) return;
        isDown = false;
        btn.classList.remove('dragging');
        setTimeout(() => { didDragRestBtn = false; }, 0);
      });

      btn.addEventListener('mousemove', e => {
        if (!isDown) return;
        const x = e.pageX - btn.offsetLeft;
        const walk = (x - startX) * 1.2;
        if (Math.abs(walk) > 4) didDragRestBtn = true;
        btn.scrollLeft = startScrollLeft - walk;
      });
    }

    (function enableStripDrag() {
      const strip = document.getElementById('dateStrip');
      if (!strip) return;
      let isDown = false;
      let startX = 0;
      let startScrollLeft = 0;

      strip.addEventListener('mousedown', e => {
        isDown = true;
        didDragStrip = false;
        strip.classList.add('dragging');
        startX = e.pageX - strip.offsetLeft;
        startScrollLeft = strip.scrollLeft;
      });

      window.addEventListener('mouseup', () => {
        if (!isDown) return;
        isDown = false;
        strip.classList.remove('dragging');
        setTimeout(() => { didDragStrip = false; }, 0);
      });

      strip.addEventListener('mousemove', e => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - strip.offsetLeft;
        const walk = (x - startX) * 1.2;
        if (Math.abs(walk) > 4) didDragStrip = true;
        strip.scrollLeft = startScrollLeft - walk;
      });
    })();

    function selectDate(d) {
      selectedDate = d;
      activeCategory = db[d]?.category || '重量訓練';
      renderAll();
    }

    function getSortedUniqueExercises(list) {
      const unique = [...new Set(list || [])];
      const rank = name => {
        if (name.includes('槓鈴')) return 1;
        if (name.includes('啞鈴')) return 2;
        if (name.includes('機械')) return 3;
        return 4;
      };
      return unique.sort((a, b) => rank(a) - rank(b));
    }

    function renderCategories() {
      const currentCat = db[selectedDate]?.category || activeCategory;
      const grid = document.getElementById('catGrid');
      if (!grid) return;
      grid.innerHTML = CATEGORIES.map(cat => {
        const isRestCat = cat === '低強度/休息';
        const activeClass = currentCat === cat ? (isRestCat ? 'active rest-cat' : 'active') : '';
        if (isRestCat) {
          return `<button type="button" id="restCatBtn" class="cat-btn rest-scroll-btn ${activeClass}" onclick="handleRestBtnClick('${cat}')">${cat}</button>`;
        }
        return `<button type="button" class="cat-btn ${activeClass}" onclick="setCategory('${cat}')">${cat}</button>`;
      }).join('');
      bindRestBtnDrag();

      const isRest = currentCat === '低強度/休息';
      const restCard = document.getElementById('restCard');
      if (restCard) restCard.classList.toggle('hidden', !isRest);
      if (isRest) {
        const alreadyMarked = Boolean(db[selectedDate]?.restMarked);
        document.getElementById('markRestBtn').textContent = alreadyMarked ? '已記錄休息日' : '記錄為休息日';
        document.getElementById('restCardDesc').textContent = alreadyMarked
          ? '已列入休息日紀錄。'
          : '點擊右上角按鈕才會把這天寫入紀錄，或直接於下方加入低強度動作。';
      }
      document.getElementById('strengthCard').classList.toggle('hidden', false);

      const pills = getSortedUniqueExercises(EXERCISE_POOL[currentCat] || []);
      document.getElementById('quickExercises').innerHTML = pills.length
        ? pills.map(ex => `<button class="pill" onclick="pickExercise('${ex}')">${ex}</button>`).join('')
        : '<span class="muted">此分類無預設快選</span>';
    }

    function setCategory(cat) {
      activeCategory = cat;
      if (db[selectedDate] && isDayRecorded(db[selectedDate])) {
        db[selectedDate].category = cat;
        saveDB();
        renderOverview();
      }
      renderCategories();
      renderDayEntries();
    }

    function markRestDay() {
      if (!db[selectedDate]) {
        db[selectedDate] = { category: '低強度/休息', exercises: [], restMarked: true };
      } else {
        db[selectedDate].category = '低強度/休息';
        db[selectedDate].restMarked = true;
      }
      saveDB();
      renderAll();
    }

    function pickExercise(name) {
      document.getElementById('exNameInput').value = name;
      const sel = document.getElementById('chartExerciseSelect');
      if (sel && [...sel.options].some(o => o.value === name)) {
        sel.value = name;
        renderProgressChart();
      }
    }

    function resetSetsUI(count = 3) {
      const container = document.getElementById('setsContainer');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 1; i <= count; i++) addSetRow(i);
    }

    function refreshSetLabels() {
      const rows = [...document.querySelectorAll('#setsContainer .row-3')];
      rows.forEach((r, i) => {
        r.querySelector('.set-idx-label').textContent = `第 ${i + 1} 組`;
        const delBtn = r.querySelector('.del-set-btn');
        if (delBtn) delBtn.style.visibility = rows.length > 1 ? 'visible' : 'hidden';
      });
    }

    function addSetRow(forcedNum = null) {
      const container = document.getElementById('setsContainer');
      if (!container) return;
      const idx = forcedNum || (container.children.length + 1);
      const div = document.createElement('div');
      div.className = 'row-3';
      div.innerHTML = `
        <span class="muted set-idx-label">第 ${idx} 組</span>
        <input type="text" inputmode="decimal" class="set-reps" placeholder="次數" />
        <input type="text" inputmode="decimal" class="set-wt" placeholder="重量kg" />
        <button type="button" class="del-set-btn" title="刪除此組" onclick="removeSpecificSetRow(this)">✕</button>
      `;
      container.appendChild(div);
      refreshSetLabels();
    }

    function removeSpecificSetRow(btn) {
      const container = document.getElementById('setsContainer');
      if (!container || container.children.length <= 1) return;
      btn.closest('.row-3').remove();
      refreshSetLabels();
    }

    function saveStrengthEntry() {
      const name = document.getElementById('exNameInput').value.trim();
      if (!name) return alert('請輸入動作名稱');
      const rows = [...document.querySelectorAll('#setsContainer .row-3')];
      const sets = rows.map((r, i) => ({
        set: i + 1,
        reps: r.querySelector('.set-reps').value.trim(),
        weight: r.querySelector('.set-wt').value.trim()
      })).filter(s => s.reps || s.weight);

      if (!db[selectedDate]) {
        db[selectedDate] = { category: activeCategory, exercises: [] };
      }
      db[selectedDate].category = activeCategory;
      db[selectedDate].exercises.push({ name, sets });
      saveDB();

      document.getElementById('exNameInput').value = '';
      resetSetsUI(3);
      renderDayEntries();
      renderDateStrip();
      renderOverview();
      renderChartExerciseOptions(name);
    }

    function renderDayEntries() {
      const day = db[selectedDate];
      const currentCat = day?.category || activeCategory;
      const box = document.getElementById('dayEntriesList');
      if (!box) return;
      const totalItems = day?.exercises?.length || 0;
      document.getElementById('daySummaryBadge').textContent = `${currentCat} · ${totalItems} 項`;

      let html = '';
      (day?.exercises || []).forEach((ex, idx) => {
        const setsHtml = (ex.sets || []).map(s => `
          <div class="set-line">
            <span>第 ${s.set} 組</span>
            <span>次數：<strong>${s.reps || '-'}</strong> ｜ 重量：<strong>${s.weight || '-'}</strong></span>
          </div>
        `).join('');
        html += `
          <div class="ex-item">
            <div class="ex-top">
              <span class="ex-name">${ex.name}</span>
              <button class="btn btn-ghost btn-sm" onclick="deleteExercise(${idx})">移除</button>
            </div>
            ${setsHtml || '<div class="muted">無組數明細</div>'}
          </div>
        `;
      });

      box.innerHTML = html || '<div class="muted">尚無紀錄（加入動作後才會記錄此日期）</div>';
    }

    function deleteExercise(idx) {
      const day = db[selectedDate];
      if (!day) return;
      day.exercises.splice(idx, 1);
      if (!isDayRecorded(day)) {
        delete db[selectedDate];
      }
      saveDB();
      renderAll();
    }

    function deleteOverviewDate(d, event) {
      if (event) event.stopPropagation();
      if (!confirm(`確定要刪除 ${d} 的紀錄嗎？`)) return;
      delete db[d];
      saveDB();
      renderAll();
    }

    function renderOverview() {
      const box = document.getElementById('overviewList');
      if (!box) return;
      const dates = Object.keys(db).filter(d => isDayRecorded(db[d])).sort().reverse();
      box.innerHTML = dates.length ? dates.map(d => {
        const day = db[d];
        const exNames = (day.exercises || []).map(e => e.name).join('、');
        const desc = exNames || (day.restMarked ? '已標記為低強度/休息日' : '無訓練項目');
        return `
          <div class="ex-item" onclick="selectDate('${d}'); switchTab('tab-log', document.querySelector('[data-tab=tab-log]'))" style="cursor:pointer;">
            <div class="ex-top">
              <span class="ex-name">${d}</span>
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="local-badge">${day.category}</span>
                <button type="button" class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="deleteOverviewDate('${d}', event)">刪除</button>
              </div>
            </div>
            <div class="muted">${desc}</div>
          </div>
        `;
      }).join('') : '<div class="muted">目前尚無歷史紀錄</div>';
    }

    function renderLibrary() {
      const box = document.getElementById('libraryList');
      if (!box) return;
      box.innerHTML = Object.entries(EXERCISE_POOL).filter(([, list]) => list.length).map(([cat, list]) => {
        const sortedList = getSortedUniqueExercises(list);
        return `
          <div style="margin-bottom:14px;">
            <div class="section-label">${cat}</div>
            <div class="pill-row">${sortedList.map(item => `<span class="pill">${item}</span>`).join('')}</div>
          </div>
        `;
      }).join('');
    }

    function parseNum(str) {
      if (!str) return 0;
      const nums = String(str).match(/[\d.]+/g);
      if (!nums || !nums.length) return 0;
      return Math.max(...nums.map(Number).filter(n => !Number.isNaN(n)));
    }

    function renderChartExerciseOptions(preferredName = null) {
      const sel = document.getElementById('chartExerciseSelect');
      if (!sel) return;
      const prevVal = preferredName || sel.value;
      const recordedNames = new Set();
      Object.keys(db).sort().forEach(d => {
        (db[d].exercises || []).forEach(ex => {
          if (ex.name) recordedNames.add(ex.name);
        });
      });

      const list = [...recordedNames];
      if (!list.length) {
        sel.innerHTML = '<option value="">尚無已紀錄動作</option>';
        renderProgressChart();
        return;
      }

      sel.innerHTML = list.map(name => `<option value="${name}">${name}</option>`).join('');
      if (prevVal && list.includes(prevVal)) sel.value = prevVal;
      renderProgressChart();
    }

    function renderProgressChart() {
      const container = document.getElementById('progressChartContainer');
      const sel = document.getElementById('chartExerciseSelect');
      const targetName = sel ? sel.value : '';
      if (!container) return;

      if (!targetName) {
        container.innerHTML = '<div class="muted" style="margin-top:8px;">新增訓練紀錄後，這裡會自動顯示重量與總量趨勢曲線。</div>';
        return;
      }

      const points = [];
      Object.keys(db).sort().forEach(d => {
        const matched = (db[d].exercises || []).filter(ex => ex.name === targetName);
        if (!matched.length) return;
        let maxWt = 0;
        let totalVol = 0;
        let totalReps = 0;
        matched.forEach(ex => {
          (ex.sets || []).forEach(s => {
            const wt = parseNum(s.weight);
            const rp = parseNum(s.reps);
            if (wt > maxWt) maxWt = wt;
            totalReps += rp;
            totalVol += wt > 0 ? wt * rp : rp;
          });
        });
        points.push({ date: d, maxWt, totalVol, totalReps });
      });

      if (!points.length) {
        container.innerHTML = '<div class="muted" style="margin-top:8px;">此動作尚無數據</div>';
        return;
      }

      const W = 320, H = 140, padL = 32, padR = 14, padT = 14, padB = 24;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const maxWeightVal = Math.max(...points.map(p => p.maxWt), 1);
      const maxVolVal = Math.max(...points.map(p => p.totalVol), 1);

      const getX = i => points.length === 1 ? padL + plotW / 2 : padL + (i / (points.length - 1)) * plotW;
      const getYWeight = v => padT + plotH - (v / maxWeightVal) * plotH;
      const getYVol = v => padT + plotH - (v / maxVolVal) * plotH;

      const weightLine = points.map((p, i) => `${getX(i).toFixed(1)},${getYWeight(p.maxWt).toFixed(1)}`).join(' ');
      const volLine = points.map((p, i) => `${getX(i).toFixed(1)},${getYVol(p.totalVol).toFixed(1)}`).join(' ');

      const weightDots = points.map((p, i) => `
        <circle cx="${getX(i).toFixed(1)}" cy="${getYWeight(p.maxWt).toFixed(1)}" r="3.5" fill="#22d3ee" />
        <text x="${getX(i).toFixed(1)}" y="${Math.max(10, getYWeight(p.maxWt) - 6).toFixed(1)}" fill="#eef4fa" font-size="9" text-anchor="middle">${p.maxWt || p.totalReps}</text>
      `).join('');

      const volDots = points.map((p, i) => `
        <circle cx="${getX(i).toFixed(1)}" cy="${getYVol(p.totalVol).toFixed(1)}" r="2.8" fill="#a3e635" />
      `).join('');

      const xLabels = points.map((p, i) => {
        if (points.length > 6 && i !== 0 && i !== points.length - 1 && i % Math.ceil(points.length / 4) !== 0) return '';
        return `<text x="${getX(i).toFixed(1)}" y="${H - 6}" fill="#8fa3b8" font-size="9" text-anchor="middle">${p.date.slice(5)}</text>`;
      }).join('');

      const first = points[0];
      const latest = points[points.length - 1];
      const bestWt = Math.max(...points.map(p => p.maxWt));
      const diffWt = +(latest.maxWt - first.maxWt).toFixed(1);
      const diffText = diffWt > 0 ? `+${diffWt}kg` : `${diffWt}kg`;

      container.innerHTML = `
        <div class="chart-wrap">
          <div class="chart-legend">
            <span><i class="legend-dot" style="background:#22d3ee;"></i>最高重量 (kg)</span>
            <span><i class="legend-dot" style="background:#a3e635;"></i>單次總訓練量</span>
          </div>
          <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
            <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#273749" stroke-width="1" />
            <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#273749" stroke-width="1" />
            <text x="${padL - 4}" y="${padT + 4}" fill="#8fa3b8" font-size="8" text-anchor="end">${maxWeightVal}</text>
            <text x="${padL - 4}" y="${H - padB}" fill="#8fa3b8" font-size="8" text-anchor="end">0</text>
            ${points.length > 1 ? `<polyline fill="none" stroke="#a3e635" stroke-width="1.8" stroke-dasharray="4 3" points="${volLine}" />` : ''}
            ${points.length > 1 ? `<polyline fill="none" stroke="#22d3ee" stroke-width="2.2" points="${weightLine}" />` : ''}
            ${volDots}
            ${weightDots}
            ${xLabels}
          </svg>
          <div class="chart-stats">
            <div class="stat-box">
              <div class="val">${bestWt} kg</div>
              <div class="lbl">歷史最高重</div>
            </div>
            <div class="stat-box">
              <div class="val">${latest.maxWt} kg</div>
              <div class="lbl">最近一次</div>
            </div>
            <div class="stat-box">
              <div class="val" style="color:${diffWt >= 0 ? 'var(--accent-2)' : 'var(--danger)'};">${diffText}</div>
              <div class="lbl">首末變化</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderJSONPreview() {
      const el = document.getElementById('jsonPreview');
      if (el) el.textContent = JSON.stringify(db, null, 2);
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `運動紀錄備份_${formatToday()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error();
          db = cleanEmptyRecords(parsed);
          saveDB();
          renderAll();
          alert('已匯入備份資料');
        } catch {
          alert('JSON 格式不正確');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function clearAllData() {
      if (!confirm('確定要清空手機本機所有運動紀錄嗎？建議先匯出備份。')) return;
      db = {};
      saveDB();
      renderAll();
    }

    function switchTab(tabId, btn) {
      ['tab-log','tab-overview','tab-library','tab-chart','tab-storage'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('hidden', id !== tabId);
      });
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    let stopwatchSec = 0;
    let stopwatchId = null;

    function formatStopwatch(sec) {
      const hrs = Math.floor(sec / 3600);
      const mins = Math.floor((sec % 3600) / 60);
      const secs = sec % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function syncStopwatchUI() {
      const isRunning = Boolean(stopwatchId);
      const btn = document.getElementById('timerToggleBtn');
      const numEl = document.getElementById('timerDisplay');
      if (btn) {
        btn.textContent = isRunning ? '❚❚' : '▶';
        btn.setAttribute('aria-label', isRunning ? '暫停碼表' : '開始碼表');
      }
      if (numEl) {
        numEl.textContent = formatStopwatch(stopwatchSec);
      }
    }

    function resetTimer() {
      clearInterval(stopwatchId);
      stopwatchId = null;
      stopwatchSec = 0;
      syncStopwatchUI();
    }

    function toggleTimer() {
      if (stopwatchId) {
        clearInterval(stopwatchId);
        stopwatchId = null;
        syncStopwatchUI();
      } else {
        stopwatchId = setInterval(() => {
          stopwatchSec++;
          syncStopwatchUI();
        }, 1000);
        syncStopwatchUI();
      }
    }

    function renderAll() {
      try {
        renderDateStrip();
        renderCategories();
        renderDayEntries();
        renderOverview();
        renderLibrary();
        renderChartExerciseOptions();
        renderJSONPreview();
      } catch (err) {
        document.body.innerHTML = `<div style="padding:20px;color:#eef4fa;font-family:sans-serif;">渲染發生錯誤：${err && err.message ? err.message : err}</div>`;
      }
    }

    resetSetsUI(3);
    syncStopwatchUI();
    renderAll();
  </script>
</body>
</html>
