<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1117" />
  <title>運動紀錄 App</title>
  <style>
    :root {
      --bg: #0b1117;
      --surface: #131c26;
      --surface-2: #1b2735;
      --border: #273749;
      --text: #eef4fa;
      --muted: #8fa3b8;
      --accent: #22d3ee;
      --accent-2: #a3e635;
      --orange: #fb923c;
      --danger: #f87171;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 17, 23, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .local-badge {
      font-size: 11px;
      background: rgba(163, 230, 53, 0.14);
      color: var(--accent-2);
      border: 1px solid rgba(163, 230, 53, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .date-bar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .month-select {
      width: auto;
      min-width: 118px;
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .date-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }
    .date-strip::-webkit-scrollbar { display: none; }
    .date-strip.dragging { cursor: grabbing; }

    .date-spacer {
      flex: 0 0 calc(50% - 31px);
      pointer-events: none;
    }

    .date-chip {
      flex: 0 0 62px;
      min-width: 62px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
    }
    .date-chip.active {
      background: rgba(34, 211, 238, 0.22);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .date-chip .wk { font-size: 11px; color: var(--muted); }
    .date-chip.active .wk { color: var(--accent); font-weight: 700; }
    .date-chip .dy { font-size: 15px; font-weight: 700; margin-top: 2px; }
    .date-chip .dot {
      width: 6px; height: 6px; border-radius: 50%;
      margin: 5px auto 0; background: var(--accent-2);
    }

    .section-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .quick-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .quick-row .section-label { margin-bottom: 0; }

    .cat-timer-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 14px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .cat-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      line-height: 1.2;
      min-width: 0;
    }
    .cat-btn.rest-scroll-btn {
      display: block;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }
    .cat-btn.rest-scroll-btn::-webkit-scrollbar { display: none; }
    .cat-btn.rest-scroll-btn.dragging { cursor: grabbing; }

    .cat-btn.active {
      background: var(--accent);
      color: #071018;
      border-color: var(--accent);
    }
    .cat-btn.active.rest-cat {
      background: var(--orange);
      color: #160b04;
      border-color: var(--orange);
    }

    .rest-inline-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .rest-inline-text {
      min-width: 0;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }
    .rest-inline-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--orange);
      margin-right: 6px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .card-title { font-size: 15px; font-weight: 700; }

    .pill-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }
    .pill:hover { border-color: var(--accent); }

    .row-3 {
      display: grid;
      grid-template-columns: 52px 1fr 1fr 28px;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .del-set-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--danger);
      border-radius: 8px;
      height: 34px;
      width: 28px;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
    }

    input, select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #071018; }
    .btn-orange { background: var(--orange); color: #160b04; }
    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-sm { padding: 6px 10px; font-size: 12px; }

    .ex-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .ex-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .ex-name { font-weight: 700; font-size: 15px; }
    .set-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      padding: 4px 0;
      border-top: 1px dashed rgba(143, 163, 184, 0.16);
    }
    .set-line strong { color: var(--text); }

    .timer-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, rgba(34,211,238,0.12), rgba(163,230,53,0.08));
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: 12px;
      padding: 7px 8px;
      gap: 6px;
      min-width: 0;
    }
    .timer-top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-height: 22px;
    }
    .timer-presets {
      display: flex;
      gap: 3px;
      flex-wrap: nowrap;
      align-items: center;
    }
    .timer-presets.hidden { display: none; }
    .preset-btn.active {
      background: var(--accent);
      color: #071018;
      border-color: var(--accent);
    }
    .timer-num {
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      white-space: nowrap;
      text-align: right;
      margin-left: auto;
    }
    .timer-action-line {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: nowrap;
    }
    .timer-btn {
      padding: 4px 5px;
      font-size: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .chart-wrap {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-top: 10px;
    }
    .chart-legend {
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .legend-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .chart-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
      text-align: center;
    }
    .stat-box {
      background: rgba(11, 17, 23, 0.55);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 4px;
    }
    .stat-box .val { font-size: 13px; font-weight: 700; color: var(--text); }
    .stat-box .lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(11, 17, 23, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 0 10px;
      z-index: 30;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      font-size: 11px; font-weight: 600; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-icon { font-size: 17px; }

    .hidden { display: none; }
    .muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-title">
      <span>運動紀錄</span>
      <span class="local-badge">純本機儲存</span>
    </div>
    <span class="muted" id="activeDateText"></span>
  </div>

  <div class="container">
    <div id="tab-log">
      <div class="date-bar-top">
        <span class="muted">拖曳或點選日期</span>
        <select id="monthSelect" class="month-select" onchange="onMonthChange(this.value)"></select>
      </div>
      <div class="date-strip" id="dateStrip"></div>

      <div class="cat-timer-row" style="margin-bottom:6px;">
        <div class="section-label" style="margin-bottom:0;">當日訓練分類</div>
        <div class="section-label" style="margin-bottom:0; text-align:right;">組間計時</div>
      </div>

      <div class="cat-timer-row">
        <div class="cat-grid" id="catGrid"></div>

        <div class="timer-box" id="timerBox">
          <div class="timer-top-line">
            <div class="timer-presets" id="timerPresets">
              <button type="button" class="btn btn-ghost timer-btn preset-btn" data-sec="30" onclick="setTimer(30)">30</button>
              <button type="button" class="btn btn-ghost timer-btn preset-btn" data-sec="60" onclick="setTimer(60)">60</button>
              <button type="button" class="btn btn-ghost timer-btn preset-btn" data-sec="90" onclick="setTimer(90)">90</button>
            </div>
            <div class="timer-num" id="timerDisplay"></div>
          </div>
          <div class="timer-action-line">
            <button type="button" class="btn btn-ghost timer-btn" onclick="resetTimer()">重新</button>
            <button type="button" class="btn btn-primary timer-btn" id="timerToggleBtn" onclick="toggleTimer()">開始</button>
          </div>
        </div>
      </div>

      <div class="card rest-inline-card hidden" id="restCard">
        <div class="rest-inline-text" id="restInlineText">
          <span class="rest-inline-title">今日狀態：低強度/休息</span>
          <span class="muted" id="restCardDesc">點擊右上角按鈕才會把這天寫入紀錄，或直接於下方加入低強度動作。</span>
        </div>
        <button type="button" class="btn btn-orange btn-sm" style="flex:0 0 auto; white-space:nowrap;" id="markRestBtn" onclick="markRestDay()">記錄為休息日</button>
      </div>

      <div class="card" id="strengthCard">
        <div class="card-header">
          <div class="card-title">新增動作組數</div>
          <span class="muted">次數 / 重量kg</span>
        </div>

        <div class="quick-row">
          <span class="section-label">常用動作快選</span>
          <span class="muted">可直接手動輸入動作</span>
        </div>
        <div class="pill-row" id="quickExercises"></div>

        <div style="margin-bottom:10px;">
          <input type="text" id="exNameInput" placeholder="動作名稱" />
        </div>

        <div id="setsContainer"></div>

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn btn-ghost btn-sm" onclick="addSetRow()">＋ 增加一組</button>
          <button class="btn btn-primary" style="flex:1;" onclick="saveStrengthEntry()">加入今日紀錄</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">當日紀錄清單</div>
          <span class="muted" id="daySummaryBadge"></span>
        </div>
        <div id="dayEntriesList"></div>
      </div>
    </div>

    <div id="tab-overview" class="hidden">
      <div class="card">
        <div class="card-title" style="margin-bottom:10px;">日期紀錄總覽</div>
        <div id="overviewList"></div>
      </div>
    </div>

    <div id="tab-library" class="hidden">
      <div class="card">
        <div class="card-title" style="margin-bottom:8px;">分類動作庫</div>
        <div id="libraryList"></div>
      </div>
    </div>

    <div id="tab-chart" class="hidden">
      <div class="card">
        <div class="card-header">
          <div class="card-title">訓練進步曲線圖</div>
          <span class="muted">依歷次紀錄自動統計</span>
        </div>
        <select id="chartExerciseSelect" onchange="renderProgressChart()"></select>
        <div id="progressChartContainer"></div>
      </div>
    </div>

    <div id="tab-storage" class="hidden">
      <div class="card">
        <div class="card-title">本機資料與備份</div>
        <p class="muted" style="line-height:1.6; margin:8px 0 12px;">
          資料僅存於手機瀏覽器本機 <code>localStorage</code>，無外部伺服器或登入系統。建議定期匯出 JSON 備份。
        </p>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" onclick="exportJSON()">匯出 JSON</button>
          <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
            匯入 JSON <input type="file" accept=".json" style="display:none;" onchange="importJSON(event)" />
          </label>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="clearAllData()">清空本機資料</button>
        </div>
        <pre id="jsonPreview" style="margin-top:12px; background:var(--surface-2); padding:10px; border-radius:10px; font-size:11px; max-height:220px; overflow:auto; color:var(--muted);"></pre>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="tab-log" onclick="switchTab('tab-log', this)">
      <span class="nav-icon">🏋️</span><span>今日紀錄</span>
    </button>
    <button class="nav-btn" data-tab="tab-overview" onclick="switchTab('tab-overview', this)">
      <span class="nav-icon">📅</span><span>日期總覽</span>
    </button>
    <button class="nav-btn" data-tab="tab-library" onclick="switchTab('tab-library', this)">
      <span class="nav-icon">📋</span><span>動作庫</span>
    </button>
    <button class="nav-btn" data-tab="tab-chart" onclick="switchTab('tab-chart', this)">
      <span class="nav-icon">📈</span><span>曲線圖</span>
    </button>
    <button class="nav-btn" data-tab="tab-storage" onclick="switchTab('tab-storage', this)">
      <span class="nav-icon">🔒</span><span>本機資料</span>
    </button>
  </nav>

  <script>
    /* ===== 可自行擴充設定區 ===== */
    const CATEGORIES = ['重量訓練', '衝浪訓練', '高強度間接', '有氧訓練', '低強度/休息'];

    /* 順序規則：槓鈴 -> 啞鈴 -> 機械 -> 其餘不重複名稱排後面 */
    const EXERCISE_POOL = {
      '重量訓練': [
        '槓鈴握推', '槓鈴深蹲', '槓鈴肩推', '槓鈴RDL', '槓鈴大腿側蹲',
        '啞鈴坐式肩推', '啞鈴胸推',
        '滑輪下拉(機械)', '水平划船(機械)', '肩側部(機械)',
        '捲腹(重訓椅&懸吊)', '引體向上'
      ],
      '衝浪訓練': [
        '啞鈴肩推(滑水)', '趴式Y式啞鈴',
        '滑輪側腹轉體', '滑輪下拉划水', '地雷管爆發上推', '地雷管單手肩推', '地雷管軀幹旋轉', '單腿RDL', '哥本哈根側棒式'
      ],
      '高強度間接': [
        '槓鈴分腿蹲',
        '啞鈴肩推(滑水)', '啞鈴反向飛鳥(Y式)',
        '大腿寬內外收(機械)', '直臂下拉(機械)',
        '肩推深蹲(複合)', '單腿RDL', '捲腹(重訓椅&懸吊)', '地雷管爆發上推'
      ],
      '有氧訓練': ['慢跑', '游泳', '20分間歇'],
      '低強度/休息': []
    };

    const STORAGE_KEY = 'personal_workout_log_v1';
    /* ============================ */

    function formatToday() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`; }  function isDayRecorded(dayObj) { if (!dayObj \vert{}\vert{} typeof dayObj !== 'object') return false; const hasExercises = Array.isArray(dayObj.exercises) && dayObj.exercises.length > 0; const isMarkedRest = Boolean(dayObj.restMarked); return hasExercises \vert{}\vert{} isMarkedRest; }  function cleanEmptyRecords(rawObj) { const cleaned = {}; if (!rawObj \vert{}\vert{} typeof rawObj !== 'object' \vert{}\vert{} Array.isArray(rawObj)) return cleaned; Object.keys(rawObj).forEach(d => { const item = rawObj[d]; if (!item \vert{}\vert{} typeof item !== 'object') return; const exercises = Array.isArray(item.exercises) ? item.exercises : []; const restMarked = Boolean(item.restMarked); if (exercises.length > 0 \vert{}\vert{} restMarked) { cleaned[d] = { category: item.category \vert{}\vert{} '重量訓練', exercises, ...(restMarked ? { restMarked: true } : {}) }; } }); return cleaned; }  function loadDB() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) \vert{}\vert{} '{}'); } catch { return {}; } }  let db = cleanEmptyRecords(loadDB()); let selectedDate = formatToday(); let activeCategory = db[selectedDate]?.category \vert{}\vert{} '重量訓練'; let didDragStrip = false; let didDragRestBtn = false;  function saveDB() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch {} renderJSONPreview(); }  function getMonthDates(ym) { const parts = String(ym \vert{}\vert{} '').split('-'); const y = Number(parts[0]) \vert{}\vert{} new Date().getFullYear(); const m = Number(parts[1]) \vert{}\vert{} (new Date().getMonth() + 1); const yStr = String(y); const mStr = String(m).padStart(2, '0'); const daysInMonth = new Date(y, m, 0).getDate(); const list = []; for (let d = 1; d <= daysInMonth; d++) { list.push(`${yStr}-${mStr}-${String(d).padStart(2, '0')}`);
      }
      return list;
    }

    function renderMonthOptions() {
      const sel = document.getElementById('monthSelect');
      if (!sel) return;
      const todayStr = formatToday();
      const currentYM = todayStr.slice(0, 7);
      const selectedYM = selectedDate.slice(0, 7);

      const months = new Set([currentYM, selectedYM]);
      const baseDate = new Date(todayStr + 'T00:00:00');
      for (let offset = -5; offset <= 1; offset++) {
        const dt = new Date(baseDate.getFullYear(), baseDate.getMonth() + offset, 1);
        months.add(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`);
      }
      Object.keys(db).forEach(d => {

      const btn = document.getElementById('restCatBtn');

      btn.dataset.dragBound = '1';
      let isDown = false;
      let startX = 0;
      let startScrollLeft = 0;

      btn.addEventListener('mousedown', e => {
        isDown = true;
        didDragRestBtn = false;
        btn.classList.add('dragging');
        startX = e.pageX - btn.offsetLeft;
        startScrollLeft = btn.scrollLeft;
      });

      window.addEventListener('mouseup', () => {
        if (!isDown) return;
        isDown = false;
        btn.classList.remove('dragging');
        setTimeout(() => { didDragRestBtn = false; }, 0);
      });

      btn.addEventListener('mousemove', e => {
        if (!isDown) return;
        const x = e.pageX - btn.offsetLeft;
        const walk = (x - startX) * 1.2;

        btn.scrollLeft = startScrollLeft - walk;

    }
