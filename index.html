<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>運動紀錄</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #162032;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .badge {
      font-size: 12px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, textarea {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    button {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #062033;
      border-color: var(--accent);
      font-weight: 700;
    }

    .btn-success {
      background: rgba(34, 197, 94, 0.16);
      border-color: rgba(34, 197, 94, 0.45);
      color: #86efac;
      font-weight: 600;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .cat-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .cat-btn {
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #062033;
      border-color: var(--accent);
      font-weight: 700;
    }

    .set-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .set-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
    }

    .set-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .set-grid label {
      font-size: 12px;
      margin-bottom: 4px;
    }

    .log-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .log-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .log-title {
      font-weight: 700;
      font-size: 15px;
    }

    .log-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .set-pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .set-pill {
      font-size: 12px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
    }

    .toast {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: #0ea5e9;
      color: #041524;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .toast.show {
      opacity: 1;
    }

    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.96);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px 8px;
      z-index: 20;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
    }

    .nav-btn.active {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 16px 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>運動紀錄</h1>
    <span class="badge">純本機儲存</span>
  </header>

  <main id="app"></main>
  <div id="toast" class="toast"></div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="log" onclick="switchTab('log')">紀錄輸入</button>
    <button class="nav-btn" data-tab="overview" onclick="switchTab('overview')">日期總覽</button>
    <button class="nav-btn" data-tab="data" onclick="switchTab('data')">本機資料</button>
  </nav>

  <script>
    const STORAGE_KEY = "workout_logs_v2";
    const CATEGORIES = ["肌力訓練", "衝浪體能", "有氧／間歇", "伸展／恢復"];

    let state = {
      tab: "log",
      date: getToday(),
      category: CATEGORIES[0],
      exercise: "",
      sets: makeDefaultSets(3),
      logs: loadLogs()
    };

    function getToday() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function makeDefaultSets(count = 3) {
      return Array.from({ length: count }, () => ({
        kg: "",
        minutes: "",
        reps: ""
      }));
    }

    function loadLogs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveLogs() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.logs));
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1600);
    }

    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      render();
    }

    function addSetRow() {
      state.sets.push({ kg: "", minutes: "", reps: "" });
      render();
    }

    function removeSetRow(index) {
      if (state.sets.length <= 1) {
        showToast("至少保留 1 組");
        return;
      }
      state.sets.splice(index, 1);
      render();
    }

    function updateSetField(index, field, value) {
      state.sets[index][field] = value;
    }

    function addEntry() {
      const name = state.exercise.trim();
      if (!name) {
        showToast("請先輸入動作名稱");
        return;
      }

      const cleanedSets = state.sets
        .map((s) => ({
          kg: String(s.kg ?? "").trim(),
          minutes: String(s.minutes ?? "").trim(),
          reps: String(s.reps ?? "").trim()
        }))
        .filter((s) => s.kg !== "" || s.minutes !== "" || s.reps !== "");

      if (cleanedSets.length === 0) {
        showToast("請至少填寫一組的重量、分鐘或次數");
        return;
      }

      state.logs.unshift({
        id: String(Date.now()) + "_" + Math.random().toString(36).slice(2, 6),
        date: state.date,
        category: state.category,
        exercise: name,
        sets: cleanedSets
      });

      saveLogs();
      state.exercise = "";
      state.sets = makeDefaultSets(3);
      showToast("已加入紀錄");
      render();
    }

    function deleteEntry(id) {
      state.logs = state.logs.filter((item) => item.id !== id);
      saveLogs();
      showToast("已刪除紀錄");
      render();
    }

    function formatSetSummary(s, idx) {
      const parts = [];
      if (s.kg !== "") parts.push(`${s.kg} kg`);
      if (s.minutes !== "") parts.push(`${s.minutes} 分`);
      if (s.reps !== "") parts.push(`${s.reps} 次`);
      return `第 ${idx + 1} 組：${parts.join(" / ")}`;
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(state.logs, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `workout-backup-${getToday()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("已匯出 JSON 備份");
    }

    function importJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result || "[]"));
          if (!Array.isArray(data)) {
            showToast("JSON 格式不正確");
            return;
          }
          state.logs = data;
          saveLogs();
          showToast("已匯入本機紀錄");
          render();
        } catch {
          showToast("無法解析 JSON 檔案");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function clearAllLogs() {
      if (!confirm("確定要清空所有本機訓練紀錄嗎？建議先匯出 JSON 備份。")) return;
      state.logs = [];
      saveLogs();
      showToast("已清空本機紀錄");
      render();
    }

    function renderLogTab() {
      const dayLogs = state.logs.filter((item) => item.date === state.date);

      const setsHtml = state.sets
        .map(
          (s, i) => `
          <div class="set-box">
            <div class="set-header">
              <span>第 ${i + 1} 組</span>
              ${
                state.sets.length > 1
                  ? `<button type="button" class="btn-danger" style="padding:3px 8px;font-size:12px;" onclick="removeSetRow(${i})">移除</button>`
                  : ""
              }
            </div>
            <div class="set-grid">
              <div>
                <label>重量 (kg)</label>
                <input type="text" inputmode="decimal" placeholder="例如 60" value="${escapeAttr(s.kg)}" oninput="updateSetField(${i}, 'kg', this.value)" />
              </div>
              <div>
                <label>分鐘</label>
                <input type="text" inputmode="decimal" placeholder="例如 10" value="${escapeAttr(s.minutes)}" oninput="updateSetField(${i}, 'minutes', this.value)" />
              </div>
              <div>
                <label>次數</label>
                <input type="text" inputmode="numeric" placeholder="例如 12" value="${escapeAttr(s.reps)}" oninput="updateSetField(${i}, 'reps', this.value)" />
              </div>
            </div>
          </div>
        `
        )
        .join("");

      const logsHtml =
        dayLogs.length === 0
          ? `<div class="empty">這天還沒有紀錄，上方填寫後按「加入今日紀錄」即可。</div>`
          : dayLogs
              .map(
                (item) => `
              <div class="log-item">
                <div class="log-top">
                  <div>
                    <div class="log-title">${escapeHtml(item.exercise)}</div>
                    <div class="log-meta">${escapeHtml(item.date)}・${escapeHtml(item.category)}</div>
                  </div>
                  <button type="button" class="btn-danger" style="padding:5px 9px;font-size:12px;" onclick="deleteEntry('${item.id}')">刪除</button>
                </div>
                <div class="set-pill-list">
                  ${(item.sets || [])
                    .map((s, idx) => `<span class="set-pill">${escapeHtml(formatSetSummary(s, idx))}</span>`)
                    .join("")}
                </div>
              </div>
            `
              )
              .join("");

      return `
        <div class="card">
          <div class="row" style="margin-bottom:12px;">
            <div style="flex:1;min-width:160px;">
              <label>訓練日期</label>
              <input type="date" value="${escapeAttr(state.date)}" onchange="state.date = this.value; render();" />
            </div>
          </div>

          <label>訓練分類</label>
          <div class="cat-list" style="margin-bottom:12px;">
            ${CATEGORIES.map(
              (cat) => `
              <button type="button" class="cat-btn ${state.category === cat ? "active" : ""}" onclick="state.category = '${escapeJs(cat)}'; render();">
                ${escapeHtml(cat)}
              </button>
            `
            ).join("")}
          </div>

          <div style="margin-bottom:12px;">
            <label>動作名稱</label>
            <input type="text" placeholder="輸入動作名稱（例如：深蹲、划船、跑步）" value="${escapeAttr(state.exercise)}" oninput="state.exercise = this.value;" />
          </div>

          ${setsHtml}

          <div class="row" style="justify-content:space-between;margin-top:10px;">
            <button type="button" class="btn-success" onclick="addSetRow()">＋ 增加一組</button>
            <button type="button" class="btn-primary" onclick="addEntry()">加入今日紀錄</button>
          </div>
        </div>

        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:10px;">
            <strong>${escapeHtml(state.date)} 紀錄（${dayLogs.length}）</strong>
          </div>
          ${logsHtml}
        </div>
      `;
    }

    function renderOverviewTab() {
      const grouped = {};
      for (const item of state.logs) {
        if (!grouped[item.date]) grouped[item.date] = [];
        grouped[item.date].push(item);
      }
      const dates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

      if (dates.length === 0) {
        return `<div class="card"><div class="empty">目前還沒有任何歷史紀錄。</div></div>`;
      }

      return dates
        .map((d) => {
          const items = grouped[d];
          return `
            <div class="card">
              <div class="row" style="justify-content:space-between;margin-bottom:10px;">
                <strong>${escapeHtml(d)}</strong>
                <span class="log-meta">${items.length} 筆動作</span>
              </div>
              ${items
                .map(
                  (it) => `
                <div class="log-item">
                  <div class="log-title">${escapeHtml(it.exercise)} <span class="log-meta">(${escapeHtml(it.category)})</span></div>
                  <div class="set-pill-list" style="margin-top:6px;">
                    ${(it.sets || [])
                      .map((s, idx) => `<span class="set-pill">${escapeHtml(formatSetSummary(s, idx))}</span>`)
                      .join("")}
                  </div>
                </div>
              `
                )
                .join("")}
            </div>
          `;
        })
        .join("");
    }

    function renderDataTab() {
      return `
        <div class="card">
          <h2 style="margin:0 0 8px 0;font-size:16px;">本機資料與備份</h2>
          <p class="log-meta" style="margin:0 0 14px 0;line-height:1.6;">
            所有資料僅保存在目前裝置的瀏覽器本機（localStorage），不會自動上傳到外部伺服器。建議定期匯出 JSON 檔保存。
          </p>
          <div class="row" style="margin-bottom:12px;">
            <button type="button" class="btn-primary" onclick="exportJSON()">匯出 JSON 備份</button>
            <label style="margin:0;cursor:pointer;">
              <span class="btn-success" style="display:inline-block;padding:9px 12px;border-radius:10px;border:1px solid rgba(34,197,94,0.45);">匯入 JSON 還原</span>
              <input type="file" accept="application/json,.json" style="display:none;" onchange="importJSON(event)" />
            </label>
          </div>
          <div class="log-meta" style="margin-bottom:12px;">目前總紀錄筆數：${state.logs.length} 筆</div>
          <button type="button" class="btn-danger" onclick="clearAllLogs()">清空所有本機紀錄</button>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById("app");
      if (state.tab === "log") app.innerHTML = renderLogTab();
      else if (state.tab === "overview") app.innerHTML = renderOverviewTab();
      else app.innerHTML = renderDataTab();
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    function escapeJs(str) {
      return String(str ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    render();
  </script>
</body>
</html>
